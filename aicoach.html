.chat-shell{
  display:flex; flex-direction:column;
  height:calc(100dvh - var(--nav-h) - var(--bottomnav-h) - 40px);
  min-height:420px;
}
@media(min-width:900px){
  .chat-shell{height:calc(100dvh - 60px);}
}

.chat-card{
  flex:1; display:flex; flex-direction:column;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-lg); box-shadow:var(--shadow-sm);
  overflow:hidden;
}

.coach-header{
  display:flex; align-items:center; gap:12px;
  padding:16px; border-bottom:1px solid var(--border);
  background:linear-gradient(135deg,rgba(106,17,203,0.06),rgba(37,117,252,0.06));
}
.coach-avatar{
  width:42px;height:42px;border-radius:14px;
  background:var(--brand-gradient); color:#fff;
  display:flex;align-items:center;justify-content:center; font-size:17px;
  flex:0 0 42px;
}
.coach-name{font-size:14.5px;font-weight:700;}
.coach-status{font-size:11px; color:var(--success); display:flex; align-items:center; gap:5px;}
.coach-status .dot{width:6px;height:6px;border-radius:50%;background:var(--success);}

.chat-scroll{
  flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px;
}

.msg-row{display:flex; gap:10px; max-width:88%;}
.msg-row.user{align-self:flex-end; flex-direction:row-reverse;}
.msg-avatar{
  width:28px;height:28px;border-radius:9px; flex:0 0 28px;
  display:flex;align-items:center;justify-content:center; font-size:12px;
}
.msg-avatar.coach{background:var(--brand-gradient); color:#fff;}
.msg-avatar.user{background:var(--surface-alt); color:var(--text-muted);}

.bubble{
  padding:11px 14px; border-radius:16px; font-size:13.5px; line-height:1.55;
}
.msg-row.coach .bubble{background:var(--surface-alt); border-bottom-left-radius:4px;}
.msg-row.user .bubble{background:var(--brand-gradient); color:#fff; border-bottom-right-radius:4px;}

.typing{display:flex; gap:4px; padding:12px 14px;}
.typing span{width:6px;height:6px;border-radius:50%;background:var(--text-faint); animation:blink 1.2s infinite;}
.typing span:nth-child(2){animation-delay:.2s;}
.typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

.quick-prompts{
  display:flex; gap:8px; overflow-x:auto; padding:10px 14px;
  border-top:1px solid var(--border); scrollbar-width:none;
}
.quick-prompts::-webkit-scrollbar{display:none;}
.qp-chip{
  flex:0 0 auto; padding:8px 14px; border-radius:20px; font-size:12px; font-weight:500;
  background:var(--surface-alt); border:1px solid var(--border); cursor:pointer; white-space:nowrap; transition:.15s;
}
.qp-chip:hover{background:rgba(106,17,203,0.08); border-color:rgba(106,17,203,0.3); color:var(--brand-1);}

.chat-input-row{
  display:flex; gap:8px; padding:12px 14px; border-top:1px solid var(--border);
}
.chat-input-row input{
  flex:1; padding:12px 14px; border-radius:24px; border:1px solid var(--border); font-family:inherit; font-size:13.5px;
}
.chat-input-row input:focus{outline:none; border-color:var(--brand-1); box-shadow:0 0 0 3px rgba(106,17,203,0.14);}
.send-btn{
  width:44px;height:44px;border-radius:50%; border:none; background:var(--brand-gradient); color:#fff;
  display:flex;align-items:center;justify-content:center; cursor:pointer; flex:0 0 44px; box-shadow:var(--shadow-brand);
}
.disclaimer{font-size:10.5px; color:var(--text-faint); text-align:center; padding:0 14px 10px;}

<script>
function soon(e){
  e.preventDefault();
  toast("This section is arriving in the next update ✨", "info");
  return false;
}
</script>

<script type="module">
import { requireAuth, getLocalData, bmiCategory, toast, displayName } from "./assets/fitcore.js";
window.toast = toast;

const scroll = document.getElementById("chatScroll");

function addMsg(text, from){
  const row = document.createElement("div");
  row.className = "msg-row " + from;
  row.innerHTML = `
    <div class="msg-avatar ${from}">${from === "coach" ? '<i class="fa-solid fa-robot"></i>' : '<i class="fa-solid fa-user"></i>'}</div>
    <div class="bubble">${text}</div>`;
  scroll.appendChild(row);
  scroll.scrollTop = scroll.scrollHeight;
}

function showTyping(){
  const row = document.createElement("div");
  row.className = "msg-row coach";
  row.id = "typingRow";
  row.innerHTML = `
    <div class="msg-avatar coach"><i class="fa-solid fa-robot"></i></div>
    <div class="bubble typing"><span></span><span></span><span></span></div>`;
  scroll.appendChild(row);
  scroll.scrollTop = scroll.scrollHeight;
}
function hideTyping(){
  const row = document.getElementById("typingRow");
  if(row) row.remove();
}

/* ---------- Coaching engine: reasons over REAL stored data ---------- */
function getWorkoutWeekCount(){
  let week = {};
  try{ week = JSON.parse(localStorage.getItem("workoutWeek")) || {}; } catch(e){}
  const now = new Date();
  const startOfWeek = new Date(now);
  startOfWeek.setDate(now.getDate() - now.getDay());
  let count = 0;
  for(let i=0;i<7;i++){
    const d = new Date(startOfWeek);
    d.setDate(startOfWeek.getDate()+i);
    if(week[d.toDateString()]) count++;
  }
  return count;
}
function loggedWorkoutToday(){
  let week = {};
  try{ week = JSON.parse(localStorage.getItem("workoutWeek")) || {}; } catch(e){}
  return !!week[new Date().toDateString()];
}

function reply(intent){
  const data = getLocalData();
  const hasStats = data.weight != null && data.bmi != null;
  const workoutsThisWeek = getWorkoutWeekCount();
  const plan = data.savedPlan;

  if(!hasStats && intent !== "greeting"){
    return `I don't have your body stats yet — head to <b>Body Stats</b> to calculate your BMI &amp; calories first, then I can give you real guidance. 📏`;
  }

  switch(intent){

    case "today":{
      const days = plan?.workoutDays || 4;
      const dur = plan?.workoutDuration || 45;
      if(loggedWorkoutToday()){
        return `You've already logged today's workout — nice work 💪. Since you're at ${workoutsThisWeek}/7 this week, maybe add a short mobility session or focus on protein intake today.`;
      }
      return `Based on your plan (${days} days/week, ${dur} min sessions), today's a good day to train. Head to <b>Workouts</b> and pick a category — I'd suggest Strength if you haven't done it in the last 2 days.`;
    }

    case "missed":
      return `No problem — missing a day happens. Don't try to "make up" for it with a much harder session; just get back to your normal plan today. Consistency over the week matters more than any single day.`;

    case "plateau":{
      if(!plan) return `Your weight may have stalled. To give you sharper advice, set up a Fitness Plan first so I know your target calories.`;
      return `A stall often means your maintenance calories have shifted as your weight changed. Your current plan targets ~${plan.targetCalories} kcal/day. Try re-running <b>Body Stats</b> to recalculate your BMR at your new weight, then adjust your target by about 100–150 kcal.`;
    }

    case "protein":{
      const kg = data.weight;
      const target = kg ? Math.round(kg * 1.8) : null;
      return target
        ? `For your current weight (~${Math.round(kg)} kg), aim for roughly <b>${target}g protein/day</b> (about 1.6–2g/kg). Spread it across 3–4 meals — eggs, chicken, paneer, lentils, and Greek yogurt are easy wins. Track it on the <b>Nutrition</b> page.`
        : `Once your weight is saved, I can calculate a precise protein target for you.`;
    }

    case "shorter":{
      const dur = plan?.workoutDuration || 45;
      const newDur = Math.max(15, dur - 15);
      return `Totally fine — a shorter, consistent session beats a long one you skip. Try trimming to ${newDur} minutes: keep the compound movements (squats, push-ups, rows) and cut isolation work first.`;
    }

    case "ontrack":{
      if(!data.targetWeight || !data.startWeight){
        return `Set a starting and target weight on the <b>Progress</b> page and I can tell you exactly how on-track you are.`;
      }
      const current = data.weight ?? data.startWeight;
      const totalPlanned = Math.abs(data.startWeight - data.targetWeight);
      const totalDone = Math.abs(data.startWeight - current);
      const pct = totalPlanned ? Math.round((totalDone/totalPlanned)*100) : 0;
      if(pct >= 90) return `You're ${pct}% of the way to your target — very close! Stay consistent for the final stretch. 🎯`;
      if(pct >= 40) return `You're ${pct}% of the way to your goal. That's solid, steady progress — keep your current routine going.`;
      return `You're at ${pct}% progress toward your target. Early days — the key now is consistency in logging weight and workouts, not speed.`;
    }

    case "focus":{
      const cat = bmiCategory(data.bmi);
      if(workoutsThisWeek < 3) return `This week, focus on <b>showing up</b> — you're at ${workoutsThisWeek}/7 workouts. Aim for 2 more sessions before Sunday, even short ones.`;
      if(cat.label === "Underweight" || cat.label === "Severely Underweight") return `Your BMI category is "${cat.label}" — this week, prioritize hitting your calorie surplus consistently over adding more cardio.`;
      if(cat.label === "Overweight" || cat.label === "Obese") return `Your BMI category is "${cat.label}" — this week, focus on nailing your calorie deficit and hitting your protein target daily to preserve muscle.`;
      return `You're in a good rhythm (${workoutsThisWeek}/7 workouts). This week, focus on progressive overload — slightly increase reps or weight versus last week.`;
    }

    case "greeting":
    default:
      return hasStats
        ? `Hey! I'm your fitness coach — I can look at your actual stats, plan, and activity to help. Try asking things like "what should I do today?" or "am I on track?"`
        : `Welcome! Once you calculate your Body Stats, I'll be able to give you personalized guidance based on your real numbers.`;
  }
}

function detectIntent(text){
  const t = text.toLowerCase();
  if(t.includes("today")) return "today";
  if(t.includes("missed") || t.includes("skip")) return "missed";
  if(t.includes("stopped") || t.includes("plateau") || t.includes("stuck")) return "plateau";
  if(t.includes("protein")) return "protein";
  if(t.includes("shorter") || t.includes("less time") || t.includes("busy")) return "shorter";
  if(t.includes("on track") || t.includes("progress")) return "ontrack";
  if(t.includes("focus") || t.includes("this week")) return "focus";
  return "greeting";
}

/* ---------- Goal parser: reads real numbers out of free text ----------
   Handles things like:
   "my weight is 85, target weight is 75, want to lose it in 3 months"
   "85kg to 75kg in 12 weeks"
   "I weigh 60 and want to reach 68 in 2 months" */
function parseGoal(text){
  const t = text.toLowerCase();
  let current = null, target = null, weeks = null;

  const fromTo = t.match(/(\d{2,3})\s*(?:kg)?\s*(?:to|->|–|-)\s*(\d{2,3})\s*(?:kg)?/);
  if(fromTo){
    current = parseFloat(fromTo[1]);
    target = parseFloat(fromTo[2]);
  } else {
    const targetMatch = t.match(/target\D{0,15}?(\d{2,3})/) || t.match(/(?:reach|goal\s*(?:of|is)?)\D{0,10}?(\d{2,3})/);
    const currentMatch = t.match(/(?:my\s+weight\s+is|current(?:ly)?\s+weight\s+is|weight\s+is|i\s*weigh|i\s*am|i'm)\D{0,10}?(\d{2,3})/);
    if(targetMatch) target = parseFloat(targetMatch[1]);
    if(currentMatch) current = parseFloat(currentMatch[1]);

    if((current == null || target == null)){
      const allNums = [...t.matchAll(/\b(\d{2,3})\b/g)].map(m => parseFloat(m[1])).filter(n => n >= 30 && n <= 250);
      if(current == null && target != null && allNums.length){
        current = allNums.find(n => n !== target) ?? null;
      }
      if(target == null && current != null && allNums.length){
        target = allNums.find(n => n !== current) ?? null;
      }
      if(current == null && target == null && allNums.length >= 2){
        current = allNums[0]; target = allNums[1];
      }
    }
  }

  const monthMatch = t.match(/(\d+(?:\.\d+)?)\s*month/);
  const weekMatch = t.match(/(\d+(?:\.\d+)?)\s*week/);
  if(monthMatch) weeks = parseFloat(monthMatch[1]) * 4.345;
  else if(weekMatch) weeks = parseFloat(weekMatch[1]);

  const mentionsGoal = /lose|loss|gain|weight|reduce|drop|target|reach/.test(t);
  if(current == null && target == null) return null;
  if(!mentionsGoal && weeks == null) return null;

  return { current, target, weeks };
}

function buildGoalPlan(goal){
  const data = getLocalData();
  let { current, target, weeks } = goal;

  if(current == null && data.weight) current = data.weight;
  if(target == null && data.targetWeight) target = data.targetWeight;

  if(current == null || target == null){
    return `I caught part of that but couldn't pin down both your current and target weight. Try something like: <b>"weight is 85, target is 75, in 3 months"</b>.`;
  }

  const diff = Math.abs(current - target);
  const goalType = current > target ? "deficit" : "surplus";

  let suggestedWeeks = false;
  if(!weeks){
    const safeRate = goalType === "deficit" ? 0.75 : 0.4;
    weeks = Math.max(4, Math.round(diff / safeRate));
    suggestedWeeks = true;
  }

  const perWeek = (diff / weeks);
  const dailyChange = Math.round((diff * 7700) / (weeks * 7));

  let healthMsg = "", healthColor = "";
  if(goalType === "deficit"){
    if(perWeek <= 1){ healthMsg = "That's a healthy, sustainable pace ✅"; healthColor = "#22c55e"; }
    else{ healthMsg = "That's a fast pace — risk of muscle loss. Consider stretching the timeline."; healthColor = "#ef4444"; }
  } else {
    if(perWeek <= 0.5){ healthMsg = "That's a healthy lean-gain pace 💪"; healthColor = "#22c55e"; }
    else{ healthMsg = "That's fast for gaining — you'll likely gain more fat than muscle."; healthColor = "#f97316"; }
  }

  let calorieLine = "";
  if(data.calories && data.age && data.gender){
    const targetCal = goalType === "deficit" ? data.calories - dailyChange : data.calories + dailyChange;
    calorieLine = `🔥 Maintenance: <b>${data.calories} kcal/day</b><br>🎯 Target: <b>${targetCal} kcal/day</b> (${goalType} of ${dailyChange} kcal/day)<br><br>`;
  } else {
    calorieLine = `⚡ Daily ${goalType} needed: <b>~${dailyChange} kcal/day</b><br><span style="font-size:11.5px;color:#888;">Complete <a href="bodystat.html" style="color:var(--brand-1);">Body Stats</a> for your exact maintenance calorie number.</span><br><br>`;
  }

  const proteinTarget = Math.round(current * 1.8);

  const workoutBlock = goalType === "deficit"
    ? `🏋️ <b>Workout (4–5 days/week):</b><br>• Strength training 3–4x/week (full body or upper/lower split)<br>• 20–25 min moderate cardio on 2–3 days<br>• 1–2 full rest days`
    : `🏋️ <b>Workout (4–5 days/week):</b><br>• Heavy strength training with progressive overload<br>• Minimal cardio (1x/week, light)<br>• Prioritize recovery — 7–8 hrs sleep`;

  const dietBlock = goalType === "deficit"
    ? `🍽️ <b>Diet:</b><br>• ~${proteinTarget}g protein/day (eggs, chicken, paneer, lentils)<br>• Fill plate with vegetables, moderate carbs<br>• Avoid sugary drinks & fried food`
    : `🍽️ <b>Diet:</b><br>• ~${proteinTarget}g protein/day<br>• Calorie-dense whole foods: rice, oats, nuts, dairy, lean meat<br>• 4–5 meals/day to hit your surplus consistently`;

  return `
    Here's a plan for <b>${Math.round(current)} kg → ${Math.round(target)} kg</b>${suggestedWeeks ? ` over a suggested <b>${Math.round(weeks)} weeks</b> (you didn't give a timeframe, so I picked a safe pace)` : ` in <b>${Math.round(weeks)} weeks</b>`}:<br><br>
    ${calorieLine}
    📉 That's about <b>${perWeek.toFixed(2)} kg/week</b> — <span style="color:${healthColor};font-weight:600;">${healthMsg}</span><br><br>
    ${workoutBlock}<br><br>
    ${dietBlock}<br><br>
    <a href="plan.html" style="color:var(--brand-1);font-weight:600;">Save this officially on the Fitness Plan page →</a>
  `;
}

window.send = function(customText){
  const input = document.getElementById("chatInput");
  const text = typeof customText === "string" ? customText : input.value.trim();
  if(!text) return;

  addMsg(text, "user");
  input.value = "";

  showTyping();
  setTimeout(() => {
    hideTyping();
    const goal = parseGoal(text);
    const answer = goal ? buildGoalPlan(goal) : reply(detectIntent(text));
    addMsg(answer, "coach");
  }, 550 + Math.random()*400);
};

document.getElementById("chatInput").addEventListener("keydown", (e) => {
  if(e.key === "Enter") window.send();
});

const PROMPTS = [
  "What should I do today?",
  "I missed yesterday's workout",
  "My weight has stopped changing",
  "How much protein should I eat?",
  "Give me a shorter workout",
  "Am I on track?",
  "What should I focus on this week?"
];

function renderPrompts(){
  const row = document.getElementById("quickPrompts");
  row.innerHTML = PROMPTS.map(p => `<div class="qp-chip">${p}</div>`).join("");
  row.querySelectorAll(".qp-chip").forEach((chip,i) => {
    chip.onclick = () => window.send(PROMPTS[i]);
  });
}

(async () => {
  const { user, isGuest } = await requireAuth();
  const name = displayName(user, isGuest);
  renderPrompts();
  addMsg(`Hi ${name} 👋 ${reply("greeting")}`, "coach");
})();
</script>
