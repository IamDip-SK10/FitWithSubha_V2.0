<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitWithSubha — AI Personal Fitness & Wellness Coach</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

html,body{
  width:100%;
  max-width:100%;
  overflow-x:hidden;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  justify-content:center;
  align-items:center;

  background:radial-gradient(circle at 20% 15%, #7a1fe0 0%, #2575fc 55%, #1c5fe0 100%);

  position:relative;
  overflow-y:auto;
  padding:20px;
  transition:opacity .4s ease;
}

body.fade-out{opacity:0;}

/* floating orbs */
.orb{
  position:absolute;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.22), transparent 70%);
  filter:blur(40px);
  pointer-events:none;
  animation:float 7s ease-in-out infinite;
}
.o1{width:220px;height:220px; top:-60px; left:-60px;}
.o2{width:180px;height:180px; top:-40px; right:-50px; animation-delay:.6s;}
.o3{width:200px;height:200px; bottom:-60px; left:-40px; animation-delay:1.1s;}
.o4{width:160px;height:160px; bottom:-40px; right:-40px; animation-delay:1.6s;}

@keyframes float{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-14px);}
}

.card{
  position:relative;
  z-index:2;
  width:100%;
  max-width:420px;
  padding:48px 32px 36px;
  border-radius:28px;
  text-align:center;
  color:#fff;

  background:rgba(255,255,255,0.09);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,0.22);

  box-shadow:
    0 30px 70px rgba(0,0,0,0.35),
    0 10px 25px rgba(106,17,203,0.3);

  animation:fadeIn .6s ease;
}

.badge-pill{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 14px;
  border-radius:30px;
  background:rgba(255,255,255,0.16);
  font-size:11px;
  font-weight:600;
  letter-spacing:.02em;
  margin-bottom:20px;
}

.logo-box{
  display:inline-flex;
  padding:14px;
  border-radius:22px;
  background:rgba(255,255,255,0.14);
  box-shadow:
    0 0 25px rgba(255,255,255,0.2),
    0 12px 30px rgba(0,0,0,0.35);
  animation:logoFloat 3s ease-in-out infinite;
}
.logo-box img{height:60px;width:60px;border-radius:14px;}

@keyframes logoFloat{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-6px);}
}

.headline{
  margin-top:22px;
  font-size:23px;
  font-weight:700;
  line-height:1.4;
  text-shadow:0 2px 10px rgba(0,0,0,0.25);
  animation:fadeInText .8s ease;
}

.tagline{
  margin-top:10px;
  font-size:13.5px;
  opacity:.88;
  line-height:1.5;
}

.feature-row{
  display:flex;
  justify-content:center;
  gap:18px;
  margin-top:22px;
  flex-wrap:wrap;
}
.feature-chip{
  font-size:10.5px;
  font-weight:500;
  opacity:.9;
  display:flex;
  align-items:center;
  gap:5px;
}

.countdown{
  margin-top:26px;
  font-size:13px;
  opacity:.85;
}

.progress-bar{
  width:100%;
  height:6px;
  background:rgba(255,255,255,0.2);
  border-radius:20px;
  margin-top:10px;
  overflow:hidden;
}
.progress{
  height:100%;
  width:0%;
  background:#fff;
  border-radius:20px;
  transition:width 1s linear;
}

.helper{
  margin-top:14px;
  font-size:11.5px;
  opacity:.7;
}

.cta-btn{
  position:relative;
  margin-top:20px;
  width:100%;
  padding:15px;
  border:none;
  border-radius:30px;

  background:#fff;
  color:#6a11cb;

  font-size:15px;
  font-weight:700;
  cursor:pointer;

  box-shadow:0 14px 32px rgba(0,0,0,0.3);
  transition:.25s;
  animation:pulse 2.5s infinite;
}
.cta-btn:hover{transform:translateY(-2px); box-shadow:0 18px 40px rgba(0,0,0,0.35);}
.cta-btn:active{transform:scale(.96);}

.footer{
  margin-top:22px;
  font-size:11px;
  opacity:.65;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(20px);}
  to{opacity:1; transform:translateY(0);}
}
@keyframes fadeInText{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(255,255,255,0.35);}
  70%{box-shadow:0 0 0 14px rgba(255,255,255,0);}
  100%{box-shadow:0 0 0 0 rgba(255,255,255,0);}
}
</style>
</head>

<body>

<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>
<div class="orb o4"></div>

<div class="card">

  <div class="badge-pill"><i class="fa-solid fa-sparkles"></i> AI Personal Fitness &amp; Wellness Coach</div>

  <div class="logo-box">
    <img src="bmilogo.png" onerror="this.style.display='none'">
  </div>

  <div class="headline">Transform your body.<br>Transform your life.</div>
  <div class="tagline">Body analysis, personalized plans, daily tracking and an AI coach — all in one place.</div>

  <div class="feature-row">
    <div class="feature-chip"><i class="fa-solid fa-chart-line"></i> Analytics</div>
    <div class="feature-chip"><i class="fa-solid fa-robot"></i> AI Coach</div>
    <div class="feature-chip"><i class="fa-solid fa-clipboard-list"></i> Smart Plans</div>
  </div>

  <div class="countdown" id="countdown">Starting in 5…</div>
  <div class="progress-bar"><div class="progress" id="progress"></div></div>
  <div class="helper">Skip the wait — start instantly ⚡</div>

  <button class="cta-btn" onclick="goNow()">Start Now 🚀</button>

  <div class="footer">© FitWithSubha — Subhadip</div>

</div>

<script>
let total = 5;
let count = total;

const el = document.getElementById("countdown");
const progress = document.getElementById("progress");

el.innerText = "Starting in " + total + " Second...";

const timer = setInterval(() => {
  count--;
  if(count > 0){
    el.innerText = "Starting in " + count + " Second...";
    progress.style.width = ((total - count) / total) * 100 + "%";
  }else{
    el.innerText = "Let's go 🔥";
    progress.style.width = "100%";
    clearInterval(timer);
    setTimeout(() => { goNow(); }, 600);
  }
}, 1000);

function goNow(){
  document.body.classList.add("fade-out");
  setTimeout(() => { redirectUser(); }, 400);
}
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCsjpgM8JYYedSINwI5lIEX94dslq59I0w",
  authDomain: "fitwithsubhav2.firebaseapp.com",
  projectId: "fitwithsubhav2",
  storageBucket: "fitwithsubhav2.firebasestorage.app",
  messagingSenderId: "38056128401",
  appId: "1:38056128401:web:3a70455963b74cb738b430"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

/* Returning users who already have weight data go straight to
   Progress instead of the onboarding Dashboard flow */
function landingPage(){
  const hasData = localStorage.getItem("startWeight") && localStorage.getItem("targetWeight");
  return hasData ? "progress.html" : "dashboard.html";
}


/* 🔥 ROUTE BASED ON AUTH STATE — now lands on the Dashboard */
window.redirectUser = function(){
  onAuthStateChanged(auth, user => {
    const isGuest = localStorage.getItem("guest") === "true";
    if(user || isGuest){
      window.location.href = landingPage();
    }else{
      window.location.href = "login.html";
    }
  });
};
</script>

</body>
</html>
